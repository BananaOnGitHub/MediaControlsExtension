name: CI

on:
  push:
    branches:
      - master
      - support_itunes_media_controls
      - 'feature/**'
      - 'dev/**'
      - 'release/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: |
          dotnet restore src/MediaControlsExtension.Media/JPSoftworks.MediaControlsExtension.Media.csproj
          dotnet restore src/MediaControlsExtension/JPSoftworks.MediaControlsExtension.csproj
          dotnet restore tests/MediaControlsExtension.Media.Tests/JPSoftworks.MediaControlsExtension.Media.Tests.csproj

      - name: Build Media library (Release)
        run: dotnet build src/MediaControlsExtension.Media/JPSoftworks.MediaControlsExtension.Media.csproj -c Release --no-restore

      - name: Build Extension (Release)
        run: dotnet build src/MediaControlsExtension/JPSoftworks.MediaControlsExtension.csproj -c Release --no-restore

      - name: Build Tests (Release)
        run: dotnet build tests/MediaControlsExtension.Media.Tests/JPSoftworks.MediaControlsExtension.Media.Tests.csproj -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/MediaControlsExtension.Media.Tests/JPSoftworks.MediaControlsExtension.Media.Tests.csproj -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

  publish-aot:
    name: Publish Native AOT (win-x64)
    runs-on: windows-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: |
          dotnet restore src/MediaControlsExtension.Media/JPSoftworks.MediaControlsExtension.Media.csproj
          dotnet restore src/MediaControlsExtension/JPSoftworks.MediaControlsExtension.csproj

      - name: Publish win-x64 Native AOT
        run: dotnet publish src/MediaControlsExtension/JPSoftworks.MediaControlsExtension.csproj /p:PublishProfile=win-x64 -c Release --no-restore

      - name: Upload Published Binary
        uses: actions/upload-artifact@v4
        with:
          name: MediaControlsExtension-win-x64
          path: src/MediaControlsExtension/bin/Release/net10.0-windows10.0.26100.0/win-x64/publish/
